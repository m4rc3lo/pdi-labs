name: Publicar documentação Doxygen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar documentação
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v6

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            ninja-build \
            libopencv-dev \
            doxygen \
            graphviz \
            python3

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Testar preparador documental
        run: |
          python3 -m unittest discover \
            -s tests/scripts \
            -p 'test_*.py' \
            -v

      - name: Preparar fonte Doxygen para o Pages
        run: |
          python3 scripts/prepare_doxygen_sources.py \
            --source docs \
            --destination build/pages-source/docs \
            --manifest docs/pages-manifest.txt \
            --repository-docs-url \
            https://github.com/m4rc3lo/pdi-labs/blob/main/docs

          test -n "$(grep -RIl '```mermaid' docs)"
          test -f build/pages-source/docs/index.md
          test -f build/pages-source/docs/image-catalog.md
          test -f build/pages-source/docs/labs/m1-1.md
          test -f build/pages-source/docs/labs/m2-3.md
          test ! -f build/pages-source/docs/building.md
          test ! -f build/pages-source/docs/testing.md

          relative_markdown_links="$(
            grep -RInE \
            '\[[^]]+\]\([^)]*\.md([#?][^)]*)?\)' \
            build/pages-source/docs \
            | grep -vE '\]\(https?://' \
            || true
          )"

          if grep -RIn '```mermaid' build/pages-source/docs; then
            echo "Bloco Mermaid permaneceu na fonte temporária."
            exit 1
          fi

          if grep -RInE \
            '^#{1,6}[[:space:]].*`[^`]+`' \
            build/pages-source/docs; then
            echo "Código inline permaneceu em título público."
            exit 1
          fi

          #if grep -RInE \
          #  '\[[^]]+\]\([^)]*\.md([#?][^)]*)?\)' \
          #  build/pages-source/docs; then
          #  echo "Link Markdown interno permaneceu na fonte temporária."
          #  exit 1
          #fi

          if [ -n "${relative_markdown_links}" ]; then
            echo "${relative_markdown_links}"
            echo "ERRO: link Markdown interno permaneceu."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          pattern = re.compile(r'(?:src|href)="(?:\.\./|/)images/')
          fence_pattern = re.compile(r"^\s*(`{3,}|~{3,})")
          problems = []

          for path in Path("build/pages-source/docs").rglob("*.md"):
              inside_fence = False
              fence_marker = None

              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  fence_match = fence_pattern.match(line)
                  if fence_match:
                      marker = fence_match.group(1)[0]
                      if not inside_fence:
                          inside_fence = True
                          fence_marker = marker
                      elif marker == fence_marker:
                          inside_fence = False
                          fence_marker = None
                      continue

                  if not inside_fence and pattern.search(line):
                      problems.append(f"{path}:{line_number}:{line}")

          if problems:
              print("\n".join(problems))
              print(
                  "Caminho de imagem incompatível permaneceu fora de "
                  "bloco de código na fonte temporária."
              )
              sys.exit(1)
          PY

      - name: Configurar documentação com CMake
        run: |
          cmake \
            -S . \
            -B build/pages-docs \
            -G Ninja \
            -DPDI_BUILD_DOCS=ON \
            -DPDI_BUILD_TESTS=OFF \
            -DPDI_BUILD_EXAMPLES=OFF \
            -DPDI_BUILD_INTERACTIVE_UI=OFF \
            -DPDI_BUILD_INTERACTIVE_TESTS=OFF \
            -DPDI_DOCUMENTATION_SOURCE_DIR="$GITHUB_WORKSPACE/build/pages-source/docs"

      - name: Gerar documentação Doxygen
        run: cmake --build build/pages-docs --target docs

      - name: Validar raiz e recursos do site
        run: |
          test -f build/pages-docs/docs/html/index.html
          test -f \
            build/pages-docs/docs/html/images/input/ai_realistic/m1_1/m1_1_a_rgb_quantizacao.png
          test -f \
            build/pages-docs/docs/html/images/results/m1_1/favoravel_channel_blue.png

          if grep -RInE \
            'language-mermaid|class="mermaid"|```mermaid' \
            build/pages-docs/docs/html; then
            echo "Mermaid não processado apareceu no HTML."
            exit 1
          fi

          if grep -RInE \
            '<h[1-6][^>]*>.*<tt>.*</tt>.*</h[1-6]>' \
            build/pages-docs/docs/html; then
            echo "Título Doxygen com elemento tt encontrado."
            exit 1
          fi

          internal_markdown_links="$(
            grep -RInE \
              'href="[^"]+\.md([#?][^"]*)?"' \
              build/pages-docs/docs/html \
              | grep -vE 'href="https?://' \
              || true
          )"

          if [ -n "${internal_markdown_links}" ]; then
            echo "${internal_markdown_links}"
            echo "Link Markdown interno incompatível permaneceu no HTML."
            exit 1
          fi

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys


          class ResourcePathValidator(HTMLParser):
              def __init__(self, path: Path) -> None:
                  super().__init__()
                  self.path = path
                  self.problems: list[str] = []

              def handle_starttag(self, tag, attrs) -> None:
                  for name, value in attrs:
                      if name not in {"src", "href"} or value is None:
                          continue
                      if value.startswith("../images/") or value.startswith("/images/"):
                          self.problems.append(
                              f"{self.path}: <{tag}> {name}={value!r}"
                          )


          problems = []
          for path in Path("build/pages-docs/docs/html").rglob("*.html"):
              parser = ResourcePathValidator(path)
              parser.feed(path.read_text(encoding="utf-8", errors="replace"))
              problems.extend(parser.problems)

          if problems:
              print("\n".join(problems))
              print("Caminho de imagem incompatível encontrado no HTML.")
              sys.exit(1)
          PY

          graphviz_count="$(find build/pages-docs/docs/html -maxdepth 1 -type f \
            \( -name '*graph*.svg' -o -name '*_incl.svg' -o -name '*_coll_graph.svg' \) \
            | wc -l)"
          echo "Recursos Graphviz encontrados: ${graphviz_count}"

      - name: Enviar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages-docs/docs/html

  deploy:
    name: Publicar GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar documentação
        id: deployment
        uses: actions/deploy-pages@v4
